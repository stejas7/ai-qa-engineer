<!doctype html><html><head><meta charset="UTF-8"><title>AI QA Engineer V4</title><style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px}input,textarea{width:100%;padding:10px;margin:6px 0 14px;box-sizing:border-box}button{padding:10px 18px}.card{border:1px solid #ddd;border-radius:10px;padding:20px;margin-bottom:20px}pre{background:#f4f4f4;padding:16px;overflow:auto}</style></head><body><h1>AI QA Engineer — V4 Execution Agent</h1><p>Test case → Playwright → UAT → evidence</p><div class="card"><label>Test ID</label><input id="testId" value="TC-LOGIN-001"><label>UAT URL</label><input id="url" value="/uat/"><label>Steps (one per line)</label><textarea id="steps" rows="6">Open the application
Enter email "test@example.com"
Enter password "Password123"
Click Login</textarea><label>Expected result</label><input id="expected" value="Verify Welcome Test User"><button onclick="runTest()">Run UAT Test</button></div><div class="card"><h2>Execution Result</h2><pre id="result">Waiting...</pre></div><script>async function runTest(){let base=location.origin;let u=url.value.startsWith('http')?url.value:base+url.value;let body={testId:testId.value,url:u,steps:steps.value.split('\n').filter(Boolean),expectedResult:expected.value,headless:true};let r=await fetch('/api/execution/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let t=await r.text();result.textContent=t;}</script></body></html>
