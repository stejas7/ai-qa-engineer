<!doctype html><html><head><meta charset="UTF-8"><title>AI QA Engineer V5</title><style>body{font-family:Arial;max-width:980px;margin:40px auto;padding:0 20px}input,textarea{width:100%;padding:10px;margin:6px 0 14px;box-sizing:border-box}button{padding:10px 18px;margin-right:8px}.card{border:1px solid #ddd;border-radius:10px;padding:20px;margin-bottom:20px}pre{background:#f4f4f4;padding:16px;overflow:auto}</style></head><body><h1>AI QA Engineer — V5 Autonomous QA Demo</h1><p>Execute UAT → collect evidence → analyze failure</p><div class="card"><label>Test ID</label><input id="testId" value="TC-LOGIN-FAIL-001"><label>UAT URL</label><input id="url" value="/uat/"><label>Steps</label><textarea id="steps" rows="6">Open the application
Enter email "test@example.com"
Enter password "Password123"
Click Login</textarea><label>Expected result</label><input id="expected" value="Verify Welcome Tejas"><button onclick="run()">Run + Analyze</button></div><div class="card"><h2>Execution</h2><pre id="execution">Waiting...</pre></div><div class="card"><h2>AI Failure Analysis</h2><pre id="analysis">Waiting...</pre></div><script>async function run(){let u=url.value.startsWith('http')?url.value:location.origin+url.value;let body={testId:testId.value,url:u,steps:steps.value.split('\n').filter(Boolean),expectedResult:expected.value,headless:true};let r=await fetch('/api/execution/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let x=await r.json();execution.textContent=JSON.stringify(x,null,2);if(x.status==='FAIL'){let a=await fetch('/api/failure-analysis/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({testId:x.testId,errorMessage:x.message,expectedResult:expected.value,url:u,screenshot:x.screenshot})});analysis.textContent=JSON.stringify(await a.json(),null,2)}else analysis.textContent='No failure — AI analysis not required.'}</script></body></html>
