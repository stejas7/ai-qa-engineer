<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Demo UAT - Login</title>
<style>body{font-family:Arial;max-width:560px;margin:50px auto;padding:24px}input{display:block;width:100%;padding:10px;margin:8px 0 16px;box-sizing:border-box}button{padding:10px 18px;margin-right:8px}.card{border:1px solid #ddd;border-radius:10px;padding:24px}#message{margin-top:20px;font-weight:bold}</style></head>
<body><div class="card"><h1>Demo UAT Login</h1><p id="subtitle">Use test@example.com / Password123</p>
<label for="email">Email</label><input id="email" name="email" type="email" placeholder="Email">
<label for="password">Password</label><input id="password" name="password" type="password" placeholder="Password">
<button id="login" type="button">Login</button><button id="logout" type="button" hidden>Logout</button>
<div id="message" role="status"></div></div>
<script>
const email=document.getElementById('email'), password=document.getElementById('password'), message=document.getElementById('message'), login=document.getElementById('login'), logout=document.getElementById('logout');
login.onclick=()=>{ if(email.value==='test@example.com' && password.value==='Password123'){message.textContent='Welcome Test User'; login.hidden=true; logout.hidden=false;} else {message.textContent='Invalid credentials';} };
logout.onclick=()=>{message.textContent='Logged out'; login.hidden=false; logout.hidden=true;};
</script></body></html>
