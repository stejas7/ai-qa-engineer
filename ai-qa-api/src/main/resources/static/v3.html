<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI QA Engineer — V3</title>
<style>body{font-family:Arial;max-width:1050px;margin:40px auto;padding:0 20px}textarea,input{width:100%;padding:10px;margin:6px 0 14px;box-sizing:border-box}button{padding:10px 18px;cursor:pointer}pre{background:#f4f4f4;padding:16px;overflow:auto;white-space:pre-wrap}.card{border:1px solid #ddd;border-radius:10px;padding:20px;margin-bottom:20px}</style></head>
<body><h1>AI QA Engineer — V3</h1><p>Test case → Playwright Java automation</p>
<div class="card"><label>Test ID</label><input id="testId" value="TC-001"><label>Test title</label><input id="title" value="Password reset happy path"><label>UAT URL</label><input id="url" value="http://localhost:8081"><label>Steps (one per line)</label><textarea id="steps" rows="6">Open the application
Enter registered email
Click reset password
Verify reset confirmation</textarea><label>Expected result</label><textarea id="expected" rows="3">A reset confirmation is displayed and the user can continue.</textarea><button onclick="generate()">Generate Playwright Automation</button></div>
<div class="card"><h2>Generated Java</h2><pre id="result">Waiting...</pre></div>
<script>async function generate(){const payload={testId:testId.value,title:title.value,url:url.value,steps:steps.value.split('\n').map(x=>x.trim()).filter(Boolean),expectedResult:expected.value};const r=await fetch('/api/automation/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const t=await r.text();result.textContent=r.ok?JSON.parse(t).code:t;}</script>
</body></html>
