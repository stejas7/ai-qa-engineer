<!doctype html><html><head><meta charset="UTF-8"><title>AI QA Engineer</title><style>body{font-family:Arial;max-width:950px;margin:40px auto;padding:0 20px}textarea,input{width:100%;padding:10px;margin:6px 0 14px;box-sizing:border-box}button{padding:10px 18px}pre{background:#f4f4f4;padding:16px;overflow:auto}.card{border:1px solid #ddd;border-radius:10px;padding:20px;margin-bottom:20px}</style></head><body><h1>AI QA Engineer — V1</h1><p>Business Requirement → AI analysis → test scenarios</p><div class="card"><label>Requirement title</label><input id="title" value="Password reset"><label>Business requirement</label><textarea id="description" rows="5">A registered customer can reset their password using their registered email address.</textarea><label>Acceptance criteria (one per line)</label><textarea id="criteria" rows="5">Registered email receives a reset link
Invalid email displays an error
Reset link expires after 15 minutes</textarea><button onclick="analyze()">Analyze Requirement</button></div><div class="card"><h2>AI Result</h2><pre id="result">Waiting...</pre></div><script>async function analyze(){const payload={title:title.value,description:description.value,acceptanceCriteria:criteria.value.split('\n').map(x=>x.trim()).filter(Boolean)};const r=await fetch('/api/requirements/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const t=await r.text();result.textContent=r.ok?JSON.stringify(JSON.parse(t),null,2):t;}</script></body></html>
