spring:
  application:
    name: ai-qa-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aiqa}
    username: ${DB_USER:aiqa}
    password: ${DB_PASSWORD:aiqa}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          temperature: 0.2
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
