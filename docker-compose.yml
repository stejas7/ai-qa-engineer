services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiqa
      POSTGRES_USER: aiqa
      POSTGRES_PASSWORD: aiqa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ai-qa-api/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqa -d aiqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-qa-api:
    image: ${AI_QA_IMAGE:-ghcr.io/stejas7/ai-qa-engineer:latest}
    container_name: ai-qa-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/aiqa
      DB_USER: aiqa
      DB_PASSWORD: aiqa
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_UAT_PLATFORM_ADMIN_EMAIL: ${AI_UAT_PLATFORM_ADMIN_EMAIL:-}
      AI_UAT_PLATFORM_ADMIN_PASSWORD: ${AI_UAT_PLATFORM_ADMIN_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - execution_evidence:/app/evidence
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  execution_evidence:
