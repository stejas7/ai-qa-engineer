name: Feature Backend Validation

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package backend
        run: mvn -B -Dmaven.test.skip=true package
