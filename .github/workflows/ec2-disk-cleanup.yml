name: EC2 Disk Cleanup

on:
  workflow_dispatch:
    inputs:
      truncate_docker_logs:
        description: "Also truncate Docker JSON logs (use only when logs are consuming significant disk)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ec2-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Cleanup, Restart and Verify EC2
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Reclaim disk space, restart Auravis and verify health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          TRUNCATE_DOCKER_LOGS: ${{ inputs.truncate_docker_logs }}
        run: |
          set -Eeuo pipefail

          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"
          trap 'rm -f "$RUNNER_TEMP/ec2_key"' EXIT

          SSH_OPTS=(
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=3
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=6
            -o StrictHostKeyChecking=no
            -i "$RUNNER_TEMP/ec2_key"
          )

          timeout 10m ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" \
            "TRUNCATE_DOCKER_LOGS='$TRUNCATE_DOCKER_LOGS' bash -se" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          echo "=== BEFORE CLEANUP ==="
          df -h /
          sudo docker system df || true

          echo "=== SAFE CLEANUP ==="
          sudo docker container prune -f || true
          sudo docker image prune -af || true
          timeout 240 sudo docker builder prune -af || true
          sudo apt-get clean || true
          sudo journalctl --vacuum-size=100M >/dev/null 2>&1 || true

          echo "=== LARGEST DOCKER JSON LOGS ==="
          sudo du -sh /var/lib/docker/containers/*/*-json.log 2>/dev/null | sort -h | tail -10 || true

          if [ "$TRUNCATE_DOCKER_LOGS" = "true" ]; then
            echo "Truncating Docker JSON logs..."
            sudo find /var/lib/docker/containers/ -name '*-json.log' -type f -exec truncate -s 0 {} \; || true
          fi

          echo "=== AFTER CLEANUP ==="
          df -h /
          sudo docker system df || true

          echo "=== RESTARTING AURAVIS ==="
          cd ~/ai-qa-engineer
          sudo docker compose restart

          echo "=== WAITING FOR BACKEND HEALTH ==="
          healthy=false
          for i in $(seq 1 45); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/actuator/health >/tmp/health.json 2>/dev/null && grep -q '"status":"UP"' /tmp/health.json; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "ERROR: Auravis did not become healthy after restart"
            sudo docker compose ps || true
            sudo docker compose logs --tail=200 ai-qa-api || true
            exit 1
          fi

          cat /tmp/health.json
          sudo docker compose ps
          echo "IMPORTANT: Docker volumes were not pruned. PostgreSQL data is preserved."
          echo "=== CLEANUP + RESTART SUCCESS ==="
          REMOTE_SCRIPT

      - name: Verify public UAT endpoint
        env:
          PUBLIC_BASE_URL: https://auravis-uat.duckdns.org
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 15); do
            response="$(curl --connect-timeout 5 --max-time 10 -fsS "$PUBLIC_BASE_URL/actuator/health" || true)"
            if echo "$response" | grep -q '"status":"UP"'; then
              echo "$response"
              echo "=== PUBLIC UAT HEALTHY ==="
              exit 0
            fi
            sleep 4
          done
          echo "ERROR: Public UAT health endpoint did not report UP"
          exit 1
