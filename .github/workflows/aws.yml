name: Deploy AI QA Engineer to AWS EC2

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  UAT_BASE_URL: https://tejas-aiqa.duckdns.org

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Diagnose and deploy to EC2
        timeout-minutes: 8
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"
          trap 'rm -f "$RUNNER_TEMP/ec2_key"' EXIT

          echo "==> Target: $EC2_HOST"
          echo "==> Checking TCP port 22..."
          if ! timeout 20 bash -c 'cat < /dev/null > /dev/tcp/$EC2_HOST/22'; then
            echo "ERROR: EC2 port 22 is unreachable from GitHub Actions."
            echo "Check EC2 instance state, public IP, Security Group inbound TCP/22, NACL and sshd."
            exit 1
          fi
          echo "==> TCP port 22 is reachable"

          echo "==> Checking SSH banner..."
          timeout 30 ssh \
            -vv \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=5 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=no \
            -i "$RUNNER_TEMP/ec2_key" \
            "$EC2_USERNAME@$EC2_HOST" 'echo "SSH connection OK"'

          echo "==> Starting remote deployment..."
          timeout 7m ssh \
            -T \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=no \
            -i "$RUNNER_TEMP/ec2_key" \
            "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd ~/ai-qa-engineer

          echo "==> Remote shell started"
          echo "==> Syncing latest main..."
          timeout 60 git fetch --prune origin main
          git reset --hard origin/main
          echo "==> Source synchronized"

          echo "==> Docker daemon status before recovery"
          sudo systemctl is-active docker || true
          sudo docker info --format 'Docker={{.ServerVersion}} Storage={{.Driver}}' || true

          echo "==> Restarting Docker to recover containerd state"
          sudo systemctl restart docker
          timeout 60 bash -c 'until sudo docker info >/dev/null 2>&1; do sleep 2; done'
          echo "==> Docker daemon is ready"

          echo "==> Docker disk usage before cleanup"
          sudo docker system df || true
          df -h / || true

          echo "==> Safely cleaning unused Docker data"
          # Volumes are deliberately NOT pruned; persistent application/database data is preserved.
          timeout 120 sudo docker system prune -af
          timeout 120 sudo docker builder prune -af || true

          echo "==> Docker disk usage after cleanup"
          sudo docker system df || true
          df -h / || true

          echo "==> Pulling images before deployment"
          if ! timeout 180 sudo docker compose pull; then
            echo "==> Initial image pull failed; restarting Docker once and retrying"
            sudo systemctl restart docker
            timeout 60 bash -c 'until sudo docker info >/dev/null 2>&1; do sleep 2; done'
            timeout 180 sudo docker compose pull
          fi

          echo "==> Building and starting containers..."
          timeout 300 sudo docker compose up -d --build --remove-orphans
          echo "==> Containers started"

          echo "==> Waiting for application health..."
          healthy=false
          for i in $(seq 1 30); do
            echo "==> Health check $i/30"
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/actuator/health >/tmp/health.json 2>/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" = true ]; then
            echo "==> Application is healthy"
            cat /tmp/health.json
            sudo docker compose ps
            exit 0
          fi

          echo "==> Deployment failed: health check did not pass"
          sudo docker compose ps -a || true
          timeout 30 sudo docker compose logs --tail=150 ai-qa-api || true
          timeout 30 sudo docker compose logs --tail=80 || true
          exit 1
          REMOTE_SCRIPT

      - name: Run V11 UAT smoke check and quality gate
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail

          echo "==> Target UAT: $UAT_BASE_URL"
          echo "==> Verifying public HTTPS health endpoint"
          health="$(curl --connect-timeout 10 --max-time 30 -fsS "$UAT_BASE_URL/actuator/health")"
          echo "$health"

          echo "$health" | grep -q '"status":"UP"' || {
            echo "ERROR: UAT health check did not report UP"
            exit 1
          }

          echo "==> Executing V11 quality gate"
          response="$(curl --connect-timeout 10 --max-time 30 -fsS \
            -X POST "$UAT_BASE_URL/api/quality-gate/evaluate" \
            -H 'Content-Type: application/json' \
            --data '{
              "totalTests": 1,
              "passedTests": 1,
              "failedTests": 0,
              "automatedTests": 1,
              "requirements": 1,
              "coveredRequirements": 1
            }')"

          echo "$response"

          echo "$response" | grep -q '"decision":"APPROVED"' || {
            echo "ERROR: V11 quality gate BLOCKED the deployment"
            exit 1
          }

          echo "==> V11 quality gate APPROVED"
          echo "==> Deployment verification complete"
