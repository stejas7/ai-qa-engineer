name: Deploy AI UAT Engineer to AWS EC2

on:
  workflow_run:
    workflows: ["AI QA Engineer Build"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  PUBLIC_BASE_URL: https://auravis-uat.duckdns.org
  IMAGE_NAME: ghcr.io/stejas7/ai-qa-engineer

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy AI UAT Engineer to EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Prepare SSH key
        id: ssh_setup
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"

      - name: EC2 connectivity and disk preflight
        id: preflight
        timeout-minutes: 3
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/ec2_key")

          if ! timeout 20 bash -c 'cat < /dev/null > /dev/tcp/'"$EC2_HOST"'/22'; then
            echo "M8_FAILURE_CLASS=SSH_FAILURE"
            echo "ERROR: TCP/22 is not reachable on EC2"
            exit 1
          fi

          if ! timeout 75 ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" 'echo "SSH connection OK"'; then
            echo "M8_FAILURE_CLASS=SSH_FAILURE"
            echo "ERROR: EC2 SSH did not become ready"
            exit 1
          fi

          available_kb="$(ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" "df --output=avail / | tail -1 | tr -d ' '")"
          echo "EC2 free space: $((available_kb / 1024)) MB"
          if [ "$available_kb" -lt 3145728 ]; then
            echo "M8_FAILURE_CLASS=LOW_DISK"
            echo "ERROR: Less than 3GB free on /. Run EC2 Disk Cleanup before redeploying."
            exit 1
          fi

      - name: Deploy immutable image
        id: image_deploy
        timeout-minutes: 6
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          AI_UAT_PLATFORM_ADMIN_EMAIL: ${{ secrets.AI_UAT_PLATFORM_ADMIN_EMAIL }}
          AI_UAT_PLATFORM_ADMIN_PASSWORD: ${{ secrets.AI_UAT_PLATFORM_ADMIN_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/ec2_key")

          if [ -z "${AI_UAT_PLATFORM_ADMIN_EMAIL:-}" ] || [ -z "${AI_UAT_PLATFORM_ADMIN_PASSWORD:-}" ]; then
            echo "ERROR: Platform Admin deployment secrets are required"
            exit 1
          fi

          PLATFORM_ADMIN_EMAIL_B64="$(printf '%s' "$AI_UAT_PLATFORM_ADMIN_EMAIL" | base64 -w0)"
          PLATFORM_ADMIN_PASSWORD_B64="$(printf '%s' "$AI_UAT_PLATFORM_ADMIN_PASSWORD" | base64 -w0)"

          SSO_ENABLED=false
          if [ -n "${GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && [ -n "${GITHUB_CLIENT_ID:-}" ] && [ -n "${GITHUB_CLIENT_SECRET:-}" ]; then
            SSO_ENABLED=true
          fi
          GOOGLE_CLIENT_ID_B64="$(printf '%s' "${GOOGLE_CLIENT_ID:-}" | base64 -w0)"
          GOOGLE_CLIENT_SECRET_B64="$(printf '%s' "${GOOGLE_CLIENT_SECRET:-}" | base64 -w0)"
          GITHUB_CLIENT_ID_B64="$(printf '%s' "${GITHUB_CLIENT_ID:-}" | base64 -w0)"
          GITHUB_CLIENT_SECRET_B64="$(printf '%s' "${GITHUB_CLIENT_SECRET:-}" | base64 -w0)"
          echo "SSO configured: $SSO_ENABLED"

          if ! printf '%s' "$GHCR_TOKEN" | timeout 90 ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"; then
            echo "M8_FAILURE_CLASS=DOCKER_PULL_FAILURE"
            echo "ERROR: GHCR authentication failed"
            exit 1
          fi

          set +e
          timeout 5m ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" "IMAGE='$IMAGE' PLATFORM_ADMIN_EMAIL_B64='$PLATFORM_ADMIN_EMAIL_B64' PLATFORM_ADMIN_PASSWORD_B64='$PLATFORM_ADMIN_PASSWORD_B64' SSO_ENABLED='$SSO_ENABLED' GOOGLE_CLIENT_ID_B64='$GOOGLE_CLIENT_ID_B64' GOOGLE_CLIENT_SECRET_B64='$GOOGLE_CLIENT_SECRET_B64' GITHUB_CLIENT_ID_B64='$GITHUB_CLIENT_ID_B64' GITHUB_CLIENT_SECRET_B64='$GITHUB_CLIENT_SECRET_B64' bash -se" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd ~/ai-qa-engineer
          timeout 90 git fetch --prune origin main
          git reset --hard origin/main

          previous_image="$(sudo docker inspect ai-qa-api --format '{{.Config.Image}}' 2>/dev/null || true)"
          echo "$previous_image" >/tmp/ai-uat-previous-image

          sudo docker container prune -f || true
          sudo docker image prune -af || true
          timeout 180 sudo docker builder prune -af || true

          if ! timeout 5m sudo docker pull "$IMAGE"; then
            echo "M8_REMOTE_FAILURE=DOCKER_PULL_FAILURE"
            exit 31
          fi

          export AI_QA_IMAGE="$IMAGE"
          export AI_UAT_PLATFORM_ADMIN_EMAIL="$(printf '%s' "$PLATFORM_ADMIN_EMAIL_B64" | base64 -d)"
          export AI_UAT_PLATFORM_ADMIN_PASSWORD="$(printf '%s' "$PLATFORM_ADMIN_PASSWORD_B64" | base64 -d)"

          if [ "$SSO_ENABLED" = true ]; then
            export SPRING_PROFILES_ACTIVE=sso
            export GOOGLE_CLIENT_ID="$(printf '%s' "$GOOGLE_CLIENT_ID_B64" | base64 -d)"
            export GOOGLE_CLIENT_SECRET="$(printf '%s' "$GOOGLE_CLIENT_SECRET_B64" | base64 -d)"
            export GITHUB_CLIENT_ID="$(printf '%s' "$GITHUB_CLIENT_ID_B64" | base64 -d)"
            export GITHUB_CLIENT_SECRET="$(printf '%s' "$GITHUB_CLIENT_SECRET_B64" | base64 -d)"
          else
            export SPRING_PROFILES_ACTIVE=""
            export GOOGLE_CLIENT_ID=""
            export GOOGLE_CLIENT_SECRET=""
            export GITHUB_CLIENT_ID=""
            export GITHUB_CLIENT_SECRET=""
          fi

          unset PLATFORM_ADMIN_EMAIL_B64 PLATFORM_ADMIN_PASSWORD_B64 GOOGLE_CLIENT_ID_B64 GOOGLE_CLIENT_SECRET_B64 GITHUB_CLIENT_ID_B64 GITHUB_CLIENT_SECRET_B64

          if ! sudo -E docker compose up -d --remove-orphans; then
            echo "M8_REMOTE_FAILURE=DOCKER_START_FAILURE"
            echo "==> Docker compose status"
            sudo docker compose ps || true
            echo "==> Recent backend logs"
            sudo docker compose logs --tail=200 ai-qa-api || true
            exit 32
          fi
          REMOTE_SCRIPT
          rc=$?
          set -e

          if [ "$rc" -eq 31 ]; then
            echo "M8_FAILURE_CLASS=DOCKER_PULL_FAILURE"
            echo "ERROR: Docker image pull failed"
            exit 1
          elif [ "$rc" -eq 32 ]; then
            echo "M8_FAILURE_CLASS=DOCKER_START_FAILURE"
            echo "ERROR: Docker Compose failed to start AI UAT Engineer; compose status and backend logs were captured above"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "M8_FAILURE_CLASS=UNKNOWN"
            echo "ERROR: Image deployment failed unexpectedly with remote exit code $rc"
            exit "$rc"
          fi

      - name: Verify local application and AI runtime
        id: local_health
        timeout-minutes: 3
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/ec2_key")

          set +e
          timeout 150 ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd ~/ai-qa-engineer

          rollback_previous_image() {
            previous_image="$(cat /tmp/ai-uat-previous-image 2>/dev/null || true)"
            if [ -z "$previous_image" ]; then
              echo "M8_ROLLBACK_STATUS=SKIPPED_NO_PREVIOUS_IMAGE"
              echo "No previous AI UAT Engineer image recorded; rollback cannot be verified"
              return 1
            fi

            echo "Rolling back to previous image: $previous_image"
            export AI_QA_IMAGE="$previous_image"
            if ! sudo -E docker compose up -d --remove-orphans; then
              echo "M8_ROLLBACK_STATUS=FAILED_START"
              sudo docker compose ps || true
              sudo docker compose logs --tail=200 ai-qa-api || true
              return 1
            fi

            for i in $(seq 1 30); do
              if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/actuator/health >/tmp/rollback-health.json 2>/dev/null && grep -q '"status":"UP"' /tmp/rollback-health.json; then
                if curl --connect-timeout 3 --max-time 10 -fsS http://localhost:8080/api/ai/runtime >/tmp/rollback-ai-runtime.json 2>/dev/null && grep -q '"framework":"Spring AI"' /tmp/rollback-ai-runtime.json; then
                  echo "M8_ROLLBACK_STATUS=VERIFIED"
                  cat /tmp/rollback-health.json
                  cat /tmp/rollback-ai-runtime.json
                  return 0
                fi
              fi
              sleep 2
            done

            echo "M8_ROLLBACK_STATUS=FAILED_RUNTIME_OR_HEALTH"
            cat /tmp/rollback-health.json 2>/dev/null || true
            cat /tmp/rollback-ai-runtime.json 2>/dev/null || true
            sudo docker compose ps || true
            sudo docker compose logs --tail=200 ai-qa-api || true
            return 1
          }

          healthy=false
          for i in $(seq 1 45); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/actuator/health >/tmp/health.json 2>/dev/null && grep -q '"status":"UP"' /tmp/health.json; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            echo "M8_FAILURE_CLASS=APP_HEALTH_FAILURE"
            sudo docker compose ps || true
            sudo docker compose logs --tail=250 ai-qa-api || true
            if ! rollback_previous_image; then
              exit 23
            fi
            exit 21
          fi

          cat /tmp/health.json

          if ! curl --connect-timeout 3 --max-time 10 -fsS http://localhost:8080/api/ai/runtime >/tmp/ai-runtime.json; then
            echo "M8_FAILURE_CLASS=RAG_RUNTIME_FAILURE"
            if ! rollback_previous_image; then
              exit 24
            fi
            exit 22
          fi
          cat /tmp/ai-runtime.json
          if ! grep -q '"framework":"Spring AI"' /tmp/ai-runtime.json; then
            echo "M8_FAILURE_CLASS=RAG_RUNTIME_FAILURE"
            if ! rollback_previous_image; then
              exit 24
            fi
            exit 22
          fi

          sudo docker compose ps
          sudo docker logout ghcr.io >/dev/null 2>&1 || true
          REMOTE_SCRIPT
          rc=$?
          set -e

          if [ "$rc" -eq 21 ]; then
            echo "M8_FAILURE_CLASS=APP_HEALTH_FAILURE"
            echo "ERROR: AI UAT Engineer container failed health verification; rollback to the previous image was verified healthy with a valid Spring AI runtime"
            exit 1
          elif [ "$rc" -eq 22 ]; then
            echo "M8_FAILURE_CLASS=RAG_RUNTIME_FAILURE"
            echo "ERROR: Spring AI/RAG runtime verification failed; rollback to the previous image was verified healthy with a valid Spring AI runtime"
            exit 1
          elif [ "$rc" -eq 23 ]; then
            echo "M8_FAILURE_CLASS=APP_HEALTH_FAILURE"
            echo "ERROR: AI UAT Engineer health verification failed and previous-image rollback did not recover health/runtime verification"
            exit 1
          elif [ "$rc" -eq 24 ]; then
            echo "M8_FAILURE_CLASS=RAG_RUNTIME_FAILURE"
            echo "ERROR: Spring AI/RAG runtime verification failed and previous-image rollback did not recover health/runtime verification"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "M8_FAILURE_CLASS=UNKNOWN"
            echo "ERROR: Local UAT verification failed unexpectedly"
            exit "$rc"
          fi

      - name: Verify public health endpoint
        id: public_health
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 15); do
            response="$(curl --connect-timeout 5 --max-time 10 -fsS "$PUBLIC_BASE_URL/actuator/health" || true)"
            if echo "$response" | grep -q '"status":"UP"'; then
              echo "$response"
              exit 0
            fi
            sleep 4
          done
          echo "M8_FAILURE_CLASS=PUBLIC_ENDPOINT_FAILURE"
          echo "ERROR: Public health endpoint did not report UP"
          exit 1

      - name: Verify public backend contracts
        id: runtime_contract
        timeout-minutes: 1
        run: |
          set -Eeuo pipefail
          if ! curl --connect-timeout 5 --max-time 20 -fsS -o /tmp/ai-runtime.json "$PUBLIC_BASE_URL/api/ai/runtime"; then
            echo "M8_FAILURE_CLASS=RAG_RUNTIME_FAILURE"
            exit 1
          fi
          cat /tmp/ai-runtime.json
          grep -q '"framework":"Spring AI"' /tmp/ai-runtime.json || {
            echo "M8_FAILURE_CLASS=RAG_RUNTIME_FAILURE"
            exit 1
          }
          curl --connect-timeout 5 --max-time 20 -fsS -o /tmp/sso-providers.json "$PUBLIC_BASE_URL/api/auth/sso/providers"
          cat /tmp/sso-providers.json
          echo "==> DEPLOYMENT SUCCESS"

      - name: M8 deployment diagnosis
        if: ${{ always() }}
        run: |
          echo "## M8 Deployment Diagnosis" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.preflight.outcome }}" = "failure" ]; then
            echo "**Classification:** SSH_FAILURE or LOW_DISK" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action:** Check the preflight log. If disk is below 3GB, run EC2 Disk Cleanup; otherwise verify SSH/network access." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.image_deploy.outcome }}" = "failure" ]; then
            echo "**Classification:** DOCKER_PULL_FAILURE, DOCKER_START_FAILURE or UNKNOWN" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action:** Read the image deployment log. Pull failures point to GHCR/image availability; start failures now include docker compose status and recent ai-qa-api logs." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.local_health.outcome }}" = "failure" ]; then
            echo "**Classification:** APP_HEALTH_FAILURE or RAG_RUNTIME_FAILURE" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action:** Review local health/runtime output and M8_ROLLBACK_STATUS. Rollback is successful only when the previous image returns /actuator/health = UP and /api/ai/runtime reports Spring AI." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.public_health.outcome }}" = "failure" ]; then
            echo "**Classification:** PUBLIC_ENDPOINT_FAILURE" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action:** Verify DuckDNS, TLS/reverse proxy and public routing while localhost remains healthy." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.runtime_contract.outcome }}" = "failure" ]; then
            echo "**Classification:** RAG_RUNTIME_FAILURE" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action:** Verify Spring AI configuration, API credentials and RAG/vector dependencies." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Classification:** SUCCESS" >> "$GITHUB_STEP_SUMMARY"
            echo "AI UAT Engineer public health and Spring AI runtime checks passed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove temporary SSH key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/ec2_key"
