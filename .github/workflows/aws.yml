name: Deploy AI UAT Engineer to AWS EC2

on:
  workflow_run:
    workflows: ["AI QA Engineer Build"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  PUBLIC_BASE_URL: https://auravis-uat.duckdns.org
  IMAGE_NAME: ghcr.io/stejas7/ai-qa-engineer

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy AI UAT Engineer to EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Prepare SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$EC2_SSH_KEY" > "$RUNNER_TEMP/ec2_key"
          chmod 600 "$RUNNER_TEMP/ec2_key"

      - name: Validate deployment secrets
        env:
          AI_UAT_PLATFORM_ADMIN_EMAIL: ${{ secrets.AI_UAT_PLATFORM_ADMIN_EMAIL }}
          AI_UAT_PLATFORM_ADMIN_PASSWORD: ${{ secrets.AI_UAT_PLATFORM_ADMIN_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.AI_UAT_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.AI_UAT_GITHUB_CLIENT_SECRET }}
        run: |
          set -Eeuo pipefail
          missing=0
          for name in AI_UAT_PLATFORM_ADMIN_EMAIL AI_UAT_PLATFORM_ADMIN_PASSWORD GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: required deployment secret mapping $name is empty"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Platform Admin secrets present"
          echo "Google OAuth secrets present"
          echo "GitHub OAuth secrets present"

      - name: EC2 connectivity and disk preflight
        id: preflight
        timeout-minutes: 2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/ec2_key")
          timeout 75 ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" 'echo "SSH connection OK"'
          available_kb="$(ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" "df --output=avail / | tail -1 | tr -d ' '")"
          echo "EC2 free space: $((available_kb / 1024)) MB"
          if [ "$available_kb" -lt 2097152 ]; then
            echo "M8_FAILURE_CLASS=LOW_DISK"
            echo "ERROR: Less than 2GB free on EC2 root filesystem"
            exit 1
          fi

      - name: Deploy immutable SSO-enabled image
        id: image_deploy
        timeout-minutes: 8
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          AI_UAT_PLATFORM_ADMIN_EMAIL: ${{ secrets.AI_UAT_PLATFORM_ADMIN_EMAIL }}
          AI_UAT_PLATFORM_ADMIN_PASSWORD: ${{ secrets.AI_UAT_PLATFORM_ADMIN_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.AI_UAT_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.AI_UAT_GITHUB_CLIENT_SECRET }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/ec2_key")

          ADMIN_EMAIL_B64="$(printf '%s' "$AI_UAT_PLATFORM_ADMIN_EMAIL" | base64 -w0)"
          ADMIN_PASSWORD_B64="$(printf '%s' "$AI_UAT_PLATFORM_ADMIN_PASSWORD" | base64 -w0)"
          GOOGLE_ID_B64="$(printf '%s' "$GOOGLE_CLIENT_ID" | base64 -w0)"
          GOOGLE_SECRET_B64="$(printf '%s' "$GOOGLE_CLIENT_SECRET" | base64 -w0)"
          GITHUB_ID_B64="$(printf '%s' "$GITHUB_CLIENT_ID" | base64 -w0)"
          GITHUB_SECRET_B64="$(printf '%s' "$GITHUB_CLIENT_SECRET" | base64 -w0)"

          printf '%s' "$GHCR_TOKEN" | timeout 90 ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" "sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          timeout 7m ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" "IMAGE='$IMAGE' ADMIN_EMAIL_B64='$ADMIN_EMAIL_B64' ADMIN_PASSWORD_B64='$ADMIN_PASSWORD_B64' GOOGLE_ID_B64='$GOOGLE_ID_B64' GOOGLE_SECRET_B64='$GOOGLE_SECRET_B64' GITHUB_ID_B64='$GITHUB_ID_B64' GITHUB_SECRET_B64='$GITHUB_SECRET_B64' bash -se" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          cd ~/ai-qa-engineer
          timeout 60 git fetch --prune origin main
          git reset --hard origin/main

          previous_image="$(sudo docker inspect ai-qa-api --format '{{.Config.Image}}' 2>/dev/null || true)"
          echo "$previous_image" >/tmp/ai-uat-previous-image

          timeout 4m sudo docker pull "$IMAGE"

          export AI_QA_IMAGE="$IMAGE"
          export AI_UAT_PLATFORM_ADMIN_EMAIL="$(printf '%s' "$ADMIN_EMAIL_B64" | base64 -d)"
          export AI_UAT_PLATFORM_ADMIN_PASSWORD="$(printf '%s' "$ADMIN_PASSWORD_B64" | base64 -d)"
          export SPRING_PROFILES_ACTIVE=sso
          export GOOGLE_CLIENT_ID="$(printf '%s' "$GOOGLE_ID_B64" | base64 -d)"
          export GOOGLE_CLIENT_SECRET="$(printf '%s' "$GOOGLE_SECRET_B64" | base64 -d)"
          export GITHUB_CLIENT_ID="$(printf '%s' "$GITHUB_ID_B64" | base64 -d)"
          export GITHUB_CLIENT_SECRET="$(printf '%s' "$GITHUB_SECRET_B64" | base64 -d)"

          sudo -E docker compose up -d --remove-orphans
          sudo docker compose ps

          echo "Container SSO profile: $(sudo docker inspect ai-qa-api --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^SPRING_PROFILES_ACTIVE=' || true)"
          REMOTE_SCRIPT

      - name: Verify local backend and SSO runtime
        id: local_health
        timeout-minutes: 3
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -Eeuo pipefail
          SSH_OPTS=(-o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=no -i "$RUNNER_TEMP/ec2_key")
          timeout 160 ssh "${SSH_OPTS[@]}" "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          healthy=false
          for i in $(seq 1 45); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/actuator/health >/tmp/health.json 2>/dev/null && grep -q '"status":"UP"' /tmp/health.json; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "M8_FAILURE_CLASS=APP_HEALTH_FAILURE"
            sudo docker logs --tail=250 ai-qa-api || true
            exit 21
          fi
          cat /tmp/health.json

          curl --connect-timeout 3 --max-time 10 -fsS http://localhost:8080/api/ai/runtime >/tmp/ai-runtime.json
          grep -q '"framework":"Spring AI"' /tmp/ai-runtime.json
          cat /tmp/ai-runtime.json

          curl --connect-timeout 3 --max-time 10 -fsS http://localhost:8080/api/auth/sso/providers >/tmp/sso.json
          cat /tmp/sso.json
          grep -q '"google"' /tmp/sso.json || { echo "M8_FAILURE_CLASS=SSO_RUNTIME_FAILURE"; exit 25; }
          grep -q '"github"' /tmp/sso.json || { echo "M8_FAILURE_CLASS=SSO_RUNTIME_FAILURE"; exit 25; }
          REMOTE_SCRIPT

      - name: Verify public health and SSO contracts
        id: runtime_contract
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          health="$(curl --connect-timeout 5 --max-time 20 -fsS "$PUBLIC_BASE_URL/actuator/health")"
          echo "$health"
          echo "$health" | grep -q '"status":"UP"'

          curl --connect-timeout 5 --max-time 20 -fsS -o /tmp/ai-runtime.json "$PUBLIC_BASE_URL/api/ai/runtime"
          cat /tmp/ai-runtime.json
          grep -q '"framework":"Spring AI"' /tmp/ai-runtime.json

          curl --connect-timeout 5 --max-time 20 -fsS -o /tmp/sso-providers.json "$PUBLIC_BASE_URL/api/auth/sso/providers"
          cat /tmp/sso-providers.json
          grep -q '"google"' /tmp/sso-providers.json || { echo "M8_FAILURE_CLASS=SSO_RUNTIME_FAILURE"; echo "ERROR: Google SSO not advertised"; exit 1; }
          grep -q '"github"' /tmp/sso-providers.json || { echo "M8_FAILURE_CLASS=SSO_RUNTIME_FAILURE"; echo "ERROR: GitHub SSO not advertised"; exit 1; }
          echo "==> DEPLOYMENT SUCCESS: health + Spring AI + Google SSO + GitHub SSO"

      - name: Deployment diagnosis
        if: ${{ always() }}
        run: |
          echo "## Deployment Diagnosis" >> "$GITHUB_STEP_SUMMARY"
          echo "Preflight: ${{ steps.preflight.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image deploy: ${{ steps.image_deploy.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Local health/SSO: ${{ steps.local_health.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Public contracts: ${{ steps.runtime_contract.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.runtime_contract.outcome }}" = "success" ]; then
            echo "**SSO gate:** Google + GitHub advertised by the live backend." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Release blocked:** deployment is not considered green until health, Spring AI, Google SSO and GitHub SSO all pass." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove temporary SSH key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/ec2_key"
