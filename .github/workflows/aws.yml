name: Deploy AI QA Engineer to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ai-qa-engineer

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building and starting Docker containers..."
            sudo docker compose up -d --build

            echo "Waiting for application startup..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health >/tmp/health.json 2>/dev/null; then
                echo "Application is healthy:"
                cat /tmp/health.json
                exit 0
              fi
              sleep 2
            done

            echo "Deployment failed: application health check did not pass."
            echo "Docker Compose status:"
            sudo docker compose ps -a
            echo "Recent application logs:"
            sudo docker compose logs --tail=150 ai-qa-api
            exit 1
